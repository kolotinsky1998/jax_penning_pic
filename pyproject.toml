[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-penning-pic"
version = "0.1.0"
description = "JAX/CUDA implementation of a Penning-discharge PIC scenario"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jax",
  "jaxlib",
  "numpy",
  "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
jax-penning-run = "jax_penning_pic.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
jax_penning_pic = ["data/cross_sections/*.txt"]
